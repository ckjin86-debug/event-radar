[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "event-radar"
version = "0.1.0"
description = "Event-driven trading radar for Korean and US stock markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pyyaml>=6.0.1",
    # Scrapling: adaptive parsing for the Inven games calendar collector
    # (parser/Adaptor only — no browser-automation extras).
    "scrapling>=0.5.1,<0.6.0",
    # edgartools: structured EDGAR access for the SEC collectors
    # (8-K discovery/conversion and Schedule 13D/13G parsing). Pinned:
    # its index/ownership parsing semantics are part of the collectors'
    # correctness contract (see collectors/sec_edgartools.py).
    "edgartools==5.62.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
