name: News Future Diagnostic

on:
  push:
    branches: [feature/compress-news-future]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Inspect NEWS_FUTURE candidates
        env:
          NAVER_API_HUB_KEY_ID: ${{ secrets.NAVER_API_HUB_KEY_ID }}
          NAVER_API_HUB_KEY: ${{ secrets.NAVER_API_HUB_KEY }}
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timedelta
          from event_radar.collectors.news_future import NewsFutureCollector

          events = NewsFutureCollector().collect(datetime.now() - timedelta(days=7))
          print(f"TOTAL={len(events)}")
          print("TYPE_COUNTS", Counter(e.event_type for e in events))
          print("PRECISION_COUNTS", Counter(e.date_precision for e in events))
          print("TICKER_COUNTS", Counter('PROXY' if e.primary_ticker == '^KS11' else 'TICKER' for e in events))
          print("TOP_COMPANIES", Counter(e.primary_company for e in events).most_common(30))
          print("SAMPLES")
          for e in events[:120]:
              print(f"{e.event_type}\t{e.date_precision}\t{e.primary_ticker}\t{e.primary_company}\t{e.event_date}\t{e.event_name}")
          PY
