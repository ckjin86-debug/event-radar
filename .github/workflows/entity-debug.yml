name: DART Entity Diagnostic

on:
  push:
    branches: ["feature/auto-related-securities-v4"]
    paths:
      - ".github/workflows/entity-debug.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Diagnose DART entity master
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          from event_radar.entities import DART_CORP_CODE_URL, parse_dart_corp_code_zip
          key = os.getenv("DART_API_KEY", "")
          print("KEY_PRESENT", bool(key), "KEY_LENGTH", len(key))
          response = requests.get(DART_CORP_CODE_URL, params={"crtfc_key": key}, timeout=10)
          print("HTTP", response.status_code)
          print("CONTENT_TYPE", response.headers.get("content-type", ""))
          print("LENGTH", len(response.content))
          print("MAGIC", response.content[:8].hex())
          try:
              rows = parse_dart_corp_code_zip(response.content)
              print("PARSED", len(rows))
              lookup = {r.company_name: r.ticker for r in rows}
              for name in ["삼성바이오로직스", "포스코인터내셔널", "샘표식품", "한화시스템", "현대자동차"]:
                  print("LOOKUP", name, lookup.get(name, "-"))
          except Exception as exc:
              print("PARSE_ERROR", type(exc).__name__, str(exc)[:300])
              print("BODY_PREFIX", response.text[:300] if not response.content.startswith(b"PK") else "ZIP")
          PY
