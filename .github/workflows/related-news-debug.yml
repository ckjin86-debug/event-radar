name: Related News Diagnostic

on:
  push:
    branches: ["feature/auto-related-securities-v4"]
    paths:
      - ".related-news-debug"
      - ".github/workflows/related-news-debug.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run live news and entity diagnostic
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_API_HUB_KEY_ID: ${{ secrets.NAVER_API_HUB_KEY_ID }}
          NAVER_API_HUB_KEY: ${{ secrets.NAVER_API_HUB_KEY }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timedelta
          import requests

          from event_radar.collectors.news_future import (
              DEFAULT_QUERIES,
              NAVER_NEWS_URL,
              NewsFutureCollector,
          )
          from event_radar.entities import load_entity_universe

          key = os.getenv("DART_API_KEY", "")
          universe = load_entity_universe(dart_api_key=key)
          counts = Counter(record.country for record in universe.records)
          print("ENTITY_TOTAL", len(universe.records), "COUNTS", dict(counts))

          headers = {
              "X-NCP-APIGW-API-KEY-ID": os.getenv("NAVER_API_HUB_KEY_ID", ""),
              "X-NCP-APIGW-API-KEY": os.getenv("NAVER_API_HUB_KEY", ""),
          }

          def fetch_query(query):
              response = requests.get(
                  NAVER_NEWS_URL,
                  headers=headers,
                  params={"query": query, "display": 100, "sort": "date"},
                  timeout=15,
              )
              response.raise_for_status()
              return query, response.json()

          payload_by_query = {}
          with ThreadPoolExecutor(max_workers=8) as executor:
              futures = [executor.submit(fetch_query, query) for query in DEFAULT_QUERIES]
              for future in as_completed(futures):
                  query, payload = future.result()
                  payload_by_query[query] = payload

          payloads = [payload_by_query[query] for query in DEFAULT_QUERIES]
          events = NewsFutureCollector(mock_payloads=payloads).collect(
              since=datetime.now() - timedelta(days=7)
          )
          resolved_events = 0
          resolved_securities = set()
          print("NEWS_COUNT", len(events))
          for event in events:
              text = " ".join(
                  part for part in (event.primary_company, event.event_name, event.evidence_text) if part
              )
              mentions = universe.resolve_mentions(text, event.country)
              if mentions:
                  resolved_events += 1
                  resolved_securities.update((m.ticker, m.company_name) for m in mentions)
              mapped = ",".join(f"{m.company_name}:{m.ticker}" for m in mentions) or "-"
              print(
                  "EVENT",
                  event.event_type,
                  event.date_precision,
                  event.event_date.isoformat(),
                  event.primary_company,
                  "=>",
                  mapped,
                  "|",
                  event.event_name,
              )
          print("DIRECT_RESOLVED_EVENTS", resolved_events)
          print("DIRECT_SECURITY_COUNT", len(resolved_securities))
          for ticker, company in sorted(resolved_securities):
              print("DIRECT_SECURITY", ticker, company)
          PY
