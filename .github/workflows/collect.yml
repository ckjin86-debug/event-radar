name: Scheduled Event Collection

on:
  schedule:
    # 21:00 UTC = 06:00 KST (KR morning before market open)
    - cron: "0 21 * * *"
    # 09:00 UTC = 18:00 KST (KR evening after market close & US premarket)
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: event-radar-collection
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Event Collection Pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_API_HUB_KEY_ID: ${{ secrets.NAVER_API_HUB_KEY_ID }}
          NAVER_API_HUB_KEY: ${{ secrets.NAVER_API_HUB_KEY }}
        run: |
          python scripts/collect.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update event datasets and site json"
            # A concurrent run may push first; retry rebase+push instead of
            # failing the whole collection over a single push race.
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Push succeeded on attempt ${attempt}."
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Push failed after 3 attempts."
                exit 1
              fi
              echo "Push attempt ${attempt} failed; retrying after rebase..."
              sleep 5
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/"

  deploy-pages:
    needs: collect-and-update
    # Serialize with deploy-pages.yml, which uses the same "pages" group, so
    # the two workflows never deploy to GitHub Pages at the same time.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
