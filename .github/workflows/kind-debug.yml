name: KIND Source Diagnostic

on:
  push:
    branches: [fix/fda-kind-live-sources]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run live KIND collector only
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import datetime
          from event_radar.collectors.kind_ipo import KindIpoCollector

          events = KindIpoCollector(timeout=20).collect(since=datetime(2026, 11, 3))
          print("KIND_EVENT_COUNT", len(events))
          print("TYPE_COUNTS", dict(Counter(e.event_type for e in events)))
          companies = sorted({e.primary_company for e in events})
          print("COMPANY_COUNT", len(companies))
          print("COMPANIES", companies[:30])
          for event in events[:25]:
              print("EVENT", event.event_date, event.event_type, event.primary_company, event.primary_ticker)
          if not events:
              raise SystemExit("KIND collector returned 0 events")
          PY
