  relation_directness: 20
  historical_edge: 30
  robustness: 15
  current_setup: 15

schedule_scores:
  CONFIRMED: 20
  EXPECTED: 10
  RUMORED: 0
  CANCELLED: 0

sample_penalty_caps:
  min_n_3: 5
  min_n_8: 15
