sources:
  fda_pdufa:
    name: "FDA_ADVISORY"
    country: "US"
    event_type: "FDA_ADVISORY_COMMITTEE"
    advisory_url: "https://www.fda.gov/advisory-committees/advisory-committee-calendar"
    timezone: "America/New_York"
    default_status: "CONFIRMED"

  entertainment_kr:
    name: "ENTER_KR"
    country: "KR"
    event_type: "ENTERTAINMENT"
    url: "https://weverse.io/notice"
    container_selector: ".notice-item"
    title_selector: ".title"
    date_regex: '(\d{4})[./-](\d{2})[./-](\d{2})'
    timezone: "Asia/Seoul"
    artist_map:
      방탄소년단: {ticker: "352820", company: "하이브"}
      BTS: {ticker: "352820", company: "하이브"}
      뉴진스: {ticker: "352820", company: "하이브"}
      NewJeans: {ticker: "352820", company: "하이브"}
      에스파: {ticker: "041510", company: "에스엠"}
      aespa: {ticker: "041510", company: "에스엠"}
      아이브: {ticker: "041510", company: "카카오"}

  games_kr:
    name: "GAMES_RELEASE"
    country: "KR"
    event_type: "GAME_RELEASE"
    # Inven retired /schedule (404); the calendar moved to /webzine/calendar.
    url: "https://www.inven.co.kr/webzine/calendar"
    container_selector: ".calendar__item"
    title_selector: ".calendar__title"
    date_selector: ".calendar__date"
    date_regex: '(\d{4})[./-](\d{2})[./-](\d{2})'
    timezone: "Asia/Seoul"
    game_map:
      inZOI: {ticker: "259960", company: "크래프톤"}
      인조이: {ticker: "259960", company: "크래프톤"}
      붉은사막: {ticker: "263750", company: "펄어비스"}
      Crimson Desert: {ticker: "263750", company: "펄어비스"}
      TL: {ticker: "036570", company: "엔씨소프트"}
      스텔라 블레이드: {ticker: "462870", company: "시프트업"}
      Stellar Blade: {ticker: "462870", company: "시프트업"}

  index_rebalance:
    name: "INDEX_KR"
    country: "KR"
    event_type: "INDEX_REBALANCE"
